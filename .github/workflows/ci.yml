name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storefront:
    name: Storefront (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Medusa backend (typecheck + build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: medusa
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medusa/package-lock.json
      - run: npm ci --no-audit --no-fund
      # `medusa build` generates .medusa/types (imported by src/scripts/seed.ts),
      # so it runs first. It reports type errors but still exits 0, so typecheck
      # separately afterwards.
      - run: npm run build
      - run: npx tsc --noEmit -p .
      - run: npm run test:integration:http
      # The README quick start depends on the seed, so run it against a real
      # database: migrate an empty one, then seed it.
      - name: Migrate and seed a fresh database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_ci_seed
          JWT_SECRET: ci-only
          COOKIE_SECRET: ci-only
        run: |
          set -o pipefail
          # db:create reads DATABASE_URL from .env, not the environment
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          npx medusa db:create --db medusa_ci_seed --no-interactive
          npx medusa db:migrate
          npm run seed 2>&1 | tee seed.log
          grep -q "MEDUSA_REGION_ID=reg_" seed.log
